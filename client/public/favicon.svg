<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient: Brand Violet to Indigo -->
    <linearGradient id="rcBg" x1="6" y1="58" x2="58" y2="6" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4338CA" />
      <stop offset="45%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <!-- Top Highlight Gradient for Squircle -->
    <linearGradient id="rcRim" x1="16" y1="4" x2="48" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.05" />
    </linearGradient>

    <!-- Document Soft Drop Shadow -->
    <filter id="docShadow" x="12" y="9" width="40" height="48" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2.5" stdDeviation="2" flood-color="#0F172A" flood-opacity="0.35" />
    </filter>

    <!-- AI Sparkle Glow & Gradient -->
    <linearGradient id="starGrad" x1="40" y1="5" x2="54" y2="21" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <filter id="starGlow" x="35" y="1" width="24" height="24" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#78350F" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Squircle Base with Brand Gradient -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="url(#rcBg)" />
  <!-- Crisp Inset Highlight Border -->
  <rect x="4" y="4" width="56" height="56" rx="15" fill="none" stroke="url(#rcRim)" stroke-width="1.2" />

  <!-- Document / Resume Page -->
  <g filter="url(#docShadow)">
    <!-- Document Body with Folded Top-Right Corner -->
    <path d="M 21 14 
             H 36 
             L 46 24 
             V 47.5 
             A 2.5 2.5 0 0 1 43.5 50 
             H 20.5 
             A 2.5 2.5 0 0 1 18 47.5 
             V 17 
             A 3 3 0 0 1 21 14 Z" 
          fill="#FFFFFF" />

    <!-- Folded Corner Flap -->
    <path d="M 36 14 
             V 21.5 
             A 2.5 2.5 0 0 0 38.5 24 
             H 46 Z" 
          fill="#EEF2FF" />
    <path d="M 36 14 L 46 24" stroke="#CBD5E1" stroke-width="0.7" stroke-linecap="round" />
  </g>

  <!-- Resume Content: Header Bar, Subhead & Sections -->
  <!-- Name / Header badge in brand Indigo -->
  <rect x="22.5" y="19.5" width="10.5" height="3" rx="1.5" fill="#6366F1" />

  <!-- Subhead line -->
  <rect x="22.5" y="25" width="16" height="2" rx="1" fill="#94A3B8" />

  <!-- Divider Line -->
  <line x1="22.5" y1="29.5" x2="41.5" y2="29.5" stroke="#E2E8F0" stroke-width="1.2" stroke-linecap="round" />

  <!-- Experience / Summary Content Lines -->
  <rect x="22.5" y="33" width="19" height="2.2" rx="1.1" fill="#64748B" />
  <rect x="22.5" y="37.5" width="15" height="2.2" rx="1.1" fill="#94A3B8" />
  <rect x="22.5" y="42" width="17" height="2.2" rx="1.1" fill="#CBD5E1" />
  <rect x="22.5" y="46.5" width="11" height="1.8" rx="0.9" fill="#E2E8F0" />

  <!-- AI Craft Magic Sparkle (4-point Star) -->
  <g filter="url(#starGlow)">
    <path d="M 47 5 
             Q 47 13 55 13 
             Q 47 13 47 21 
             Q 47 13 39 13 
             Q 47 13 47 5 Z" 
          fill="url(#starGrad)" />
    <!-- Bright White Core -->
    <circle cx="47" cy="13" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Secondary Accent Sparkle -->
  <path d="M 53.5 20 
           Q 53.5 23 56.5 23 
           Q 53.5 23 53.5 26 
           Q 53.5 23 50.5 23 
           Q 53.5 23 53.5 20 Z" 
        fill="#FDE047" />
</svg>
